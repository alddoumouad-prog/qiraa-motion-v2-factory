name: Validate library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate_library.py
      - name: Check metadata and demo files
        run: |
          test -f index.html
          test -f library.js
          test -f demo/Qiraa_Tactile_Demo.mp3
          test -f LICENSE
