name: Qiraa factory cloud diagnostic

on:
  repository_dispatch:
    types: [qiraa_cloud_check]

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Render and validate sample
        id: render
        run: python factory/pipeline.py --spec spec.json
      - name: Upload sample output
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: qiraa-motion-v2-diagnostic
          path: output/
          if-no-files-found: error
          retention-days: 2
      - name: Record diagnostic outcome
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ github.event.client_payload.check_id }}
          JOB_STATUS: ${{ job.status }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
        with:
          script: |
            const path = 'diagnostics/github_actions_test.json';
            const {owner, repo} = context.repo;
            const data = {
              check_id: process.env.CHECK_ID,
              result: process.env.JOB_STATUS,
              steps: {install: process.env.INSTALL_RESULT, tests: process.env.TESTS_RESULT, render: process.env.RENDER_RESULT, artifact: process.env.ARTIFACT_RESULT},
              run_id: context.runId,
              run_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              tested_commit: context.sha,
              note: 'Diagnostic run; the sample remains a draft and source rights are not confirmed.'
            };
            let sha;
            try { sha = (await github.rest.repos.getContent({owner, repo, path})).data.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,
              message:'Record GitHub Actions diagnostic result',
              content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64'),
              ...(sha ? {sha} : {})});
