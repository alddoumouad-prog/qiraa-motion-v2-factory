name: Produce Motion V2 draft

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Path to the committed spec JSON (within this repository)'
        required: true
        default: 'spec.json'
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate specification
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["SPEC_PATH"]).resolve(); root=pathlib.Path.cwd(); assert p.is_relative_to(root) and p.is_file(), "spec must be a file in the repository"'
          python factory/pipeline.py --validate-only --spec "$SPEC_PATH"
      - name: Render and run automated checks
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
        run: python factory/pipeline.py --spec "$SPEC_PATH"
      - name: Upload draft and QC materials
        uses: actions/upload-artifact@v4
        with:
          name: qiraa-motion-v2-draft
          path: output/
          if-no-files-found: error
          retention-days: 14
