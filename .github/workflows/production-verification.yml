name: Qiraa production workflow verification
on:
  repository_dispatch:
    types: [qiraa_check_production]
permissions:
  actions: write
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run and verify the real production workflow
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/produce.yml/runs?per_page=100"
          before=$(gh api "$endpoint" --jq '[.workflow_runs[].id] | join(",")')
          gh workflow run produce.yml --repo "$GITHUB_REPOSITORY" --ref main -f spec_path=spec.json
          run_id=""
          for i in $(seq 1 30); do
            json=$(gh api "$endpoint")
            run_id=$(printf '%s' "$json" | jq -r --arg sha "$EXPECTED_SHA" --arg prev ",$before," '[.workflow_runs[] | select(.event == "workflow_dispatch" and .head_sha == $sha) | select(("," + (.id|tostring) + ",") as $id | ($prev|contains($id))|not)][0].id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo 'Could not discover the production run'; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Production workflow run: $run_id"
          for i in $(seq 1 100); do
            data=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(printf '%s' "$data" | jq -r '.status')
            conclusion=$(printf '%s' "$data" | jq -r '.conclusion // empty')
            echo "Status: $status ${conclusion}"
            if [ "$status" = completed ]; then
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              [ "$conclusion" = success ]
              exit
            fi
            sleep 10
          done
          echo 'Timed out waiting for production workflow'
          exit 1
      - name: Record real production test outcome
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ github.event.client_payload.check_id }}
          JOB_STATUS: ${{ job.status }}
          PRODUCTION_RESULT: ${{ steps.production.outcome }}
          PRODUCTION_RUN_ID: ${{ steps.production.outputs.run_id }}
          PRODUCTION_CONCLUSION: ${{ steps.production.outputs.conclusion }}
        with:
          script: |
            const path = 'diagnostics/production_actions_test.json';
            const {owner, repo} = context.repo;
            const id = process.env.PRODUCTION_RUN_ID;
            const data = {
              check_id: process.env.CHECK_ID,
              result: process.env.JOB_STATUS,
              production_step: process.env.PRODUCTION_RESULT,
              production_conclusion: process.env.PRODUCTION_CONCLUSION,
              production_run_id: id,
              production_run_url: id ? `https://github.com/${owner}/${repo}/actions/runs/${id}` : null,
              verification_run_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              note: 'Sample is a draft; source permission remains unconfirmed.'
            };
            let sha;
            try { sha = (await github.rest.repos.getContent({owner, repo, path})).data.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,
              message:'Record production workflow verification',
              content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64'),
              ...(sha ? {sha} : {})});
